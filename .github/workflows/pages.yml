# Publica la versión web (carpeta webapp/) en GitHub Pages: hosting estático y
# gratuito. Todo el procesamiento ocurre en el navegador de cada usuario.
#
# Una sola vez: Settings → Pages → Source: "GitHub Actions".
name: Versión web (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests de la versión web
        run: node --test webapp/tests/*.test.mjs
      - name: Preparar el sitio (sin los tests)
        run: rsync -a --exclude tests webapp/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
